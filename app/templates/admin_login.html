<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/jpeg" href="/static/logo.jpg" sizes="any">
  <link rel="shortcut icon" href="/static/logo.jpg" sizes="any">
  <title>ورود مدیریت — دقیقه</title>
  <link rel="stylesheet" href="/static/app.css?v=20260729-4">
  <style>
    body { font-family: Vazirmatn, sans-serif; background: #f3f7fb; min-height: 100vh; display: grid; place-items: center; }
    .panel { background: white; border-radius: 16px; padding: 28px; width: min(92vw, 420px); box-shadow: 0 16px 40px rgba(0,0,0,.08); }
    h1 { margin-top: 0; font-size: 1.3rem; }
    form { display: grid; gap: 12px; }
    input, button { font: inherit; padding: 12px; border-radius: 10px; border: 1px solid #dbe4ee; }
    button { background: #0f766e; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>ورود به پنل مدیریت</h1>
    <form method="post" action="/admin/login">
      <label for="password">رمز عبور</label>
      <input id="password" name="password" type="password" required>
      <button type="submit">ورود</button>
    </form>
  </main>
</body>
</html>

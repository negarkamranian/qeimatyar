<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/static/logo.jpg" type="image/jpeg">
  <title>{% block title %}پنل مدیریت — دقیقه{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/admin.css?v=20260804-1">
</head>
<body>
  <header class="admin-topbar">
    <a class="admin-brand" href="/admin">
      <img src="/static/logo.jpg" alt="">
      <span><strong>دقیقه</strong><small>مرکز مدیریت</small></span>
    </a>
    <a class="view-site" href="/" target="_blank" rel="noopener">مشاهده سایت <span aria-hidden="true">↗</span></a>
  </header>
  <main class="wrap">
    <div class="layout">
      <aside class="sidebar">
        <span class="sidebar-label">گزارش‌ها</span>
        <nav aria-label="گزارش‌های مدیریتی">
          <a href="/admin" class="{% if active_tab == 'overview' %}active{% endif %}" {% if active_tab == 'overview' %}aria-current="page"{% endif %}><span>⌂</span>نمای کلی</a>
          <a href="/admin/metrics" class="{% if active_tab == 'metrics' %}active{% endif %}" {% if active_tab == 'metrics' %}aria-current="page"{% endif %}><span>↗</span>متریک‌ها</a>
          <a href="/admin/users" class="{% if active_tab == 'users' %}active{% endif %}" {% if active_tab == 'users' %}aria-current="page"{% endif %}><span>◎</span>کاربران</a>
        </nav>
        <span class="sidebar-label">عملیات</span>
        <nav aria-label="عملیات سامانه">
          <a href="/admin/notifications" class="{% if active_tab == 'notifications' %}active{% endif %}"><span>◇</span>اعلان‌ها</a>
          <a href="/admin/usdt" class="{% if active_tab == 'usdt' %}active{% endif %}"><span>＄</span>USDT</a>
          <a href="/admin/llm" class="{% if active_tab == 'llm' %}active{% endif %}"><span>✦</span>سرویس LLM</a>
          <a href="/admin/connectivity" class="{% if active_tab == 'connectivity' %}active{% endif %}"><span>⌁</span>وضعیت اتصال</a>
          <a href="/admin/settings" class="{% if active_tab == 'settings' %}active{% endif %}"><span>⚙</span>تنظیمات</a>
        </nav>
      </aside>
      <section class="admin-content">
        {% block content %}{% endblock %}
      </section>
    </div>
  </main>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const toasts = document.querySelectorAll(".toast");
      toasts.forEach(toast => {
        setTimeout(() => toast.classList.add("hide"), 4000);
        toast.addEventListener("transitionend", () => toast.remove());
      });
    });
  </script>
  {% block extra_data %}{% endblock %}
</body>
</html>

<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}پنل مدیریت — قیمت‌یار{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css?v=20260729-4">
  <style>
    body { font-family: Vazirmatn, sans-serif; background: #f3f7fb; color: #132238; }
    .wrap { max-width: 1120px; margin: 32px auto 48px; background: white; border-radius: 20px; padding: 24px; box-shadow: 0 16px 40px rgba(0,0,0,.08); }
    .layout { display: grid; grid-template-columns: 220px 1fr; gap: 18px; }
    .sidebar { padding: 16px; border-radius: 16px; background: #f8fbff; border: 1px solid #e7eef5; }
    .sidebar a { display: block; padding: 10px 12px; margin-bottom: 8px; border-radius: 10px; color: #234; text-decoration: none; }
    .sidebar a.active { background: #0f766e; color: white; }
    h1 { margin-top: 0; }
    h2 { margin: 0 0 8px; font-size: 1.05rem; }
    .card { margin-top: 16px; padding: 16px; border: 1px solid #e7eef5; border-radius: 16px; background: #fff; }
    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 16px 0 20px; }
    .summary-card { padding: 14px; border: 1px solid #e7eef5; border-radius: 14px; background: linear-gradient(135deg, #f8fbff 0%, #f1f6fb 100%); }
    .summary-card strong { display: block; font-size: 1.2rem; margin-top: 4px; }
    .hint { color: #5b6b7f; font-size: .95rem; }
    .subtle { color: #6b7280; font-size: .85rem; }
    form { display: grid; gap: 14px; }
    .row { display: grid; gap: 8px; }
    label { font-weight: 600; }
    input, select, button, textarea { font: inherit; padding: 12px; border-radius: 10px; border: 1px solid #dbe4ee; }
    button { background: #0f766e; color: white; border: none; cursor: pointer; }
    .danger-button { background: #b45309; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .95rem; }
    th, td { padding: 10px 8px; border-bottom: 1px solid #e7eef5; text-align: right; }
    th { color: #5b6b7f; font-weight: 700; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 999px; font-size: .8rem; background: #e8f6ef; color: #166c50; }
    .badge.inactive { background: #f3f4f6; color: #6b7280; }
    .back-link { display: inline-block; margin-bottom: 16px; color: #0f766e; text-decoration: none; font-weight: 600; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="layout">
      <aside class="sidebar">
        <strong>پنل مدیریت</strong>
        <a href="/admin" class="{% if active_tab == 'overview' %}active{% endif %}">نمای کلی</a>
        <a href="/admin/users" class="{% if active_tab == 'users' %}active{% endif %}">سرویس کاربران</a>
        <a href="/admin/notifications" class="{% if active_tab == 'notifications' %}active{% endif %}">سرویس نوتیف</a>
        <a href="/admin/usdt" class="{% if active_tab == 'usdt' %}active{% endif %}">سرویس USDT</a>
        <a href="/admin/settings" class="{% if active_tab == 'settings' %}active{% endif %}">تنظیمات و دیپلوی سایت</a>
      </aside>
      <section>
        {% block content %}{% endblock %}
      </section>
    </div>
  </main>
</body>
</html>

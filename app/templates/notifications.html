<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>اعلان‌های {{ account.vendor_title }} — دقیقه</title>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg" sizes="any">
  <link rel="shortcut icon" href="/static/logo.svg" sizes="any">
  <link rel="apple-touch-icon" href="/static/logo.svg" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/merchant.css?v=20260729-5">
</head>
<body>
  <header class="simple-header">
    <a class="brand" href="/">
      <span class="brand-mark">
        <img src="/static/logo.svg" alt="دقیقه" onload="this.nextElementSibling.hidden=true" onerror="this.style.display='none'; this.nextElementSibling.hidden=false;">
        <span class="brand-mark-fallback">ق</span>
      </span>
      <span><strong>دقیقه</strong><small>پیشنهاد دهنده هوشمند لحظه‌ای قیمت</small></span>
    </a>
    <div class="account-actions">
      <a href="/merchant">محصولات غرفه</a>
      <form method="post" action="/logout"><button>خروج</button></form>
    </div>
  </header>

  <main class="merchant-main notifications-main">
    <section class="merchant-head">
      <div>
        <p class="eyebrow">اعلان‌های غرفه</p>
        <h1>{{ account.vendor_title }}</h1>
        <p><span id="unread-count">{{ unread_count }}</span> اعلان خوانده‌نشده</p>
      </div>
      <button id="mark-notifications-read" class="sync-button">خواندن همه</button>
    </section>

    <section class="notifications-page">
      <div id="notifications-list" class="notifications-list page-list">
        <div class="empty-state">در حال بارگذاری…</div>
      </div>
    </section>
  </main>

  <script src="/static/global_notifications.js" defer></script>
  <script src="/static/notifications.js" defer></script>
</body>
</html>
